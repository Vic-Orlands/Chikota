<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap" rel="stylesheet">
		<script>try{const t=localStorage.getItem('chikota-theme');const theme=t==='forest'||t==='ember'?t:t==='dark'?'forest':'light';document.documentElement.dataset.theme=theme;document.documentElement.classList.toggle('dark',theme!=='light');document.documentElement.style.colorScheme=theme==='light'?'light':'dark';}catch{}</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chikota extension settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Ruthie&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>chikota.</h1>
      <h2>a home for your good finds.</h2>
      <p>
        set the address of your chikota app. saved links open there and are
        added to your reading list.
      </p>
      <form>
        <label for="url">chikota address</label
        ><input
          id="url"
          type="url"
          placeholder="http://localhost:5173"
          required
        /><button>save address</button>
        <p id="status" role="status"></p>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
